<svg viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" font-family="Roboto, sans-serif">
  <!-- La misma pantalla de una app de domicilios en tres niveles de fidelidad.
       Wireframe: la estructura · Mockup: la apariencia · Prototipo: el funcionamiento. -->
  <rect width="1200" height="720" fill="#ffffff"/>

  <!-- ════ WIREFRAME ════ -->
  <g>
    <rect x="40" y="40" width="280" height="560" rx="28" fill="#ffffff" stroke="#222222" stroke-width="3"/>
    <rect x="140" y="56" width="80" height="10" rx="5" fill="#dddddd"/>
    <!-- header -->
    <rect x="64" y="86" width="232" height="36" fill="#e5e5e5"/>
    <!-- imagen del plato: placeholder con diagonales -->
    <rect x="64" y="138" width="232" height="140" fill="#f2f2f2" stroke="#cccccc" stroke-width="1.5"/>
    <line x1="64" y1="138" x2="296" y2="278" stroke="#cccccc" stroke-width="1.5"/>
    <line x1="296" y1="138" x2="64" y2="278" stroke="#cccccc" stroke-width="1.5"/>
    <!-- título y descripción -->
    <rect x="64" y="294" width="180" height="16" fill="#dddddd"/>
    <rect x="64" y="320" width="130" height="11" fill="#e5e5e5"/>
    <!-- opciones -->
    <rect x="64" y="352" width="68" height="28" rx="14" fill="none" stroke="#bbbbbb" stroke-width="1.5"/>
    <rect x="146" y="352" width="68" height="28" rx="14" fill="none" stroke="#bbbbbb" stroke-width="1.5"/>
    <rect x="228" y="352" width="68" height="28" rx="14" fill="none" stroke="#bbbbbb" stroke-width="1.5"/>
    <!-- precio y tiempo -->
    <rect x="64" y="404" width="90" height="14" fill="#dddddd"/>
    <rect x="216" y="406" width="80" height="11" fill="#e5e5e5"/>
    <!-- botón -->
    <rect x="64" y="448" width="232" height="48" rx="10" fill="#e5e5e5" stroke="#999999" stroke-width="1.5"/>
    <rect x="125" y="467" width="110" height="10" fill="#bbbbbb"/>
    <text x="180" y="656" text-anchor="middle" font-size="20" font-weight="900" letter-spacing="2" fill="#111111" text-transform="uppercase">Wireframe</text>
    <text x="180" y="682" text-anchor="middle" font-size="15" fill="#6f6f6f">la estructura</text>
  </g>

  <!-- ════ MOCKUP ════ -->
  <g>
    <rect x="460" y="40" width="280" height="560" rx="28" fill="#ffffff" stroke="#222222" stroke-width="3"/>
    <rect x="560" y="56" width="80" height="10" rx="5" fill="#dddddd"/>
    <!-- header -->
    <rect x="484" y="86" width="232" height="36" fill="#222222"/>
    <text x="496" y="109" font-size="14" font-weight="700" fill="#ffffff">La Arepería</text>
    <!-- imagen del plato -->
    <rect x="484" y="138" width="232" height="140" fill="#f2f2f2"/>
    <circle cx="600" cy="208" r="44" fill="#ffffff" stroke="#dddddd" stroke-width="2"/>
    <circle cx="600" cy="208" r="28" fill="#eeff41"/>
    <!-- título y descripción -->
    <text x="484" y="308" font-size="17" font-weight="900" fill="#111111">Arepa de choclo</text>
    <text x="484" y="328" font-size="12" fill="#6f6f6f">Queso · mantequilla · sal</text>
    <!-- opciones -->
    <rect x="484" y="352" width="68" height="28" rx="14" fill="none" stroke="#cccccc" stroke-width="1.5"/>
    <text x="518" y="370" text-anchor="middle" font-size="11" fill="#666666">Sola</text>
    <rect x="566" y="352" width="82" height="28" rx="14" fill="#222222"/>
    <text x="607" y="370" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Con queso</text>
    <rect x="662" y="352" width="54" height="28" rx="14" fill="none" stroke="#cccccc" stroke-width="1.5"/>
    <text x="689" y="370" text-anchor="middle" font-size="11" fill="#666666">Doble</text>
    <!-- precio y tiempo -->
    <text x="484" y="416" font-size="15" font-weight="900" fill="#111111">$12.000</text>
    <text x="716" y="416" text-anchor="end" font-size="12" fill="#6f6f6f">15–20 min</text>
    <!-- botón -->
    <rect x="484" y="448" width="232" height="48" rx="10" fill="#eeff41"/>
    <text x="600" y="477" text-anchor="middle" font-size="14" font-weight="900" fill="#111111">Agregar · $12.000</text>
    <text x="600" y="656" text-anchor="middle" font-size="20" font-weight="900" letter-spacing="2" fill="#111111" text-transform="uppercase">Mockup</text>
    <text x="600" y="682" text-anchor="middle" font-size="15" fill="#6f6f6f">la apariencia</text>
  </g>

  <!-- ════ PROTOTIPO ════ -->
  <g>
    <rect x="880" y="40" width="280" height="560" rx="28" fill="#ffffff" stroke="#222222" stroke-width="3"/>
    <rect x="980" y="56" width="80" height="10" rx="5" fill="#dddddd"/>
    <!-- header -->
    <rect x="904" y="86" width="232" height="36" fill="#222222"/>
    <text x="916" y="109" font-size="14" font-weight="700" fill="#ffffff">La Arepería</text>
    <!-- imagen del plato -->
    <rect x="904" y="138" width="232" height="140" fill="#f2f2f2"/>
    <circle cx="1020" cy="208" r="44" fill="#ffffff" stroke="#dddddd" stroke-width="2"/>
    <circle cx="1020" cy="208" r="28" fill="#eeff41"/>
    <!-- título y descripción -->
    <text x="904" y="308" font-size="17" font-weight="900" fill="#111111">Arepa de choclo</text>
    <text x="904" y="328" font-size="12" fill="#6f6f6f">Queso · mantequilla · sal</text>
    <!-- opciones -->
    <rect x="904" y="352" width="68" height="28" rx="14" fill="none" stroke="#cccccc" stroke-width="1.5"/>
    <text x="938" y="370" text-anchor="middle" font-size="11" fill="#666666">Sola</text>
    <rect x="986" y="352" width="82" height="28" rx="14" fill="#222222"/>
    <text x="1027" y="370" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">Con queso</text>
    <rect x="1082" y="352" width="54" height="28" rx="14" fill="none" stroke="#cccccc" stroke-width="1.5"/>
    <text x="1109" y="370" text-anchor="middle" font-size="11" fill="#666666">Doble</text>
    <!-- precio y tiempo -->
    <text x="904" y="416" font-size="15" font-weight="900" fill="#111111">$12.000</text>
    <text x="1136" y="416" text-anchor="end" font-size="12" fill="#6f6f6f">15–20 min</text>
    <!-- el prototipo responde: confirmación + toque -->
    <rect x="904" y="540" width="232" height="34" rx="8" fill="#222222"/>
    <text x="1020" y="561" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Agregado al pedido ✓</text>
    <!-- botón presionado -->
    <rect x="904" y="448" width="232" height="48" rx="10" fill="#eeff41" stroke="#111111" stroke-width="2.5"/>
    <text x="1020" y="477" text-anchor="middle" font-size="14" font-weight="900" fill="#111111">Agregar · $12.000</text>
    <!-- indicador de toque -->
    <circle cx="1096" cy="472" r="18" fill="none" stroke="#444444" stroke-width="2"/>
    <circle cx="1096" cy="472" r="7" fill="#444444"/>
    <text x="1020" y="656" text-anchor="middle" font-size="20" font-weight="900" letter-spacing="2" fill="#111111" text-transform="uppercase">Prototipo</text>
    <text x="1020" y="682" text-anchor="middle" font-size="15" fill="#6f6f6f">el funcionamiento</text>
  </g>
</svg>
