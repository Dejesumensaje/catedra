<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>¿Cuánta hambre tienes? | Pensamiento Sensorial</title>
<meta name="description" content="Demo móvil: separa dos dedos sobre el plato para pasar de una empanada a una salchipapa gigante y suelta cuando encuentres tu plato.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --mostaza:#F4B41A;
  --tomate:#D7261E;
  --mayo:#FFF7DF;
  --tinta:#2A1406;
  --tinta-suave:rgba(42,20,6,.62);
  --aji:#3F8F3A;
  --plato:#FFFFFF;
  --display:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  --base:280px;
}
html{height:100%;box-sizing:border-box;overflow:hidden}
*,*::before,*::after{box-sizing:border-box}
body{
  height:100%;margin:0;overflow:hidden;
  color:var(--tinta);font-family:var(--body);
  background-color:var(--mayo);
  background-image:
    linear-gradient(90deg,rgba(215,38,30,.12) 50%,transparent 50%),
    linear-gradient(rgba(215,38,30,.12) 50%,transparent 50%);
  background-size:46px 46px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
.app{
  height:100%;max-width:520px;margin:0 auto;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-columns:minmax(0,1fr);
  padding-inline:16px;padding-block:14px 16px;gap:10px;
  touch-action:none;
}

/* ---------- cabecera ---------- */
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  background:var(--tinta);color:var(--mostaza);display:inline-block;padding:4px 8px;border-radius:4px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,9vw,44px);line-height:.98;
  margin:8px 0 0;letter-spacing:-.01em;text-wrap:balance}
h1 em{font-style:normal;color:var(--tomate)}
.reset{
  flex:none;margin-top:2px;border:2.5px solid var(--tinta);background:var(--plato);color:var(--tinta);
  font:600 13px/1 var(--body);padding:9px 12px;border-radius:999px;cursor:pointer;
  box-shadow:0 3px 0 var(--tinta);display:flex;align-items:center;gap:6px;
}
.reset:active{transform:translateY(2px);box-shadow:0 1px 0 var(--tinta)}
.reset:focus-visible,.again:focus-visible{outline:3px solid var(--tomate);outline-offset:3px}
.reset svg{width:14px;height:14px}

/* ---------- escenario ---------- */
.stage{position:relative;z-index:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);place-items:center;overflow:visible;cursor:grab}
.stage > *{grid-area:1/1;min-width:0}
.rays{
  width:calc(var(--base)*1.9);height:calc(var(--base)*1.9);border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(244,180,26,.95) 0 9deg,transparent 9deg 20deg);
  -webkit-mask:radial-gradient(circle,#000 30%,transparent 68%);mask:radial-gradient(circle,#000 30%,transparent 68%);
  opacity:0;transform:scale(.4);pointer-events:none;
}
.chosen .rays{animation:spin 40s linear infinite}
@keyframes spin{to{rotate:360deg}}
.mat{
  width:calc(var(--base)*1.08);height:calc(var(--base)*1.08);border-radius:50%;
  background:var(--mostaza);border:3px solid var(--tinta);
  box-shadow:inset 0 0 0 10px var(--mostaza),inset 0 0 0 12px rgba(42,20,6,.28);
}
.shake{width:var(--base);height:var(--base);will-change:transform}
.sizer{width:100%;height:100%;transition:transform .55s cubic-bezier(.34,1.56,.64,1)}
.tension{position:relative;width:100%;height:100%}
.plate{
  position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle,#fff 0 58%,#EFEAE0 59% 61%,#fff 62% 100%);
  border:3px solid var(--tinta);box-shadow:0 9px 0 rgba(42,20,6,.2);
}
.dish{position:absolute;left:50%;top:50%;width:141.3%;height:141.3%;translate:-50% -50%;opacity:0;overflow:visible;pointer-events:none}

.stamp{
  position:absolute;z-index:3;width:118px;height:118px;border-radius:50%;
  background:var(--tomate);color:var(--mayo);border:3px solid var(--tinta);
  display:grid;place-items:center;text-align:center;padding:14px;
  font:400 17px/1 var(--display);box-shadow:0 5px 0 var(--tinta);
  opacity:0;pointer-events:none;left:0;top:0;
}
.stamp::before{content:"";position:absolute;inset:6px;border-radius:50%;border:2px dashed rgba(255,247,223,.7)}

.steam{position:absolute;z-index:2;width:120px;height:90px;pointer-events:none;opacity:0;left:0;top:0}
.chosen .steam{opacity:1}
.steam path{fill:none;stroke:rgba(42,20,6,.28);stroke-width:5;stroke-linecap:round;animation:rise 2.4s ease-in-out infinite;opacity:0}
.steam path:nth-child(2){animation-delay:.8s}
.steam path:nth-child(3){animation-delay:1.6s}
@keyframes rise{0%{transform:translateY(20px);opacity:0}30%{opacity:1}100%{transform:translateY(-26px);opacity:0}}

.hint{position:relative;z-index:4;width:180px;height:120px;pointer-events:none;transition:opacity .3s}
.hint[data-off]{opacity:0}
.finger{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;
  background:rgba(255,247,223,.75);border:3px solid var(--tinta);box-shadow:0 0 0 7px rgba(42,20,6,.12)}
.f1{animation:f1 2s cubic-bezier(.45,0,.3,1) infinite}
.f2{animation:f2 2s cubic-bezier(.45,0,.3,1) infinite}
@keyframes f1{0%,15%{transform:translate(-14px,14px)}60%,80%{transform:translate(-62px,40px)}100%{transform:translate(-14px,14px)}}
@keyframes f2{0%,15%{transform:translate(14px,-14px)}60%,80%{transform:translate(62px,-40px)}100%{transform:translate(14px,-14px)}}

/* ---------- hambrómetro ---------- */
.meter{position:relative;z-index:2;display:grid;gap:6px}
.bars{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:48px}
.bar{border-radius:5px 5px 2px 2px;background:rgba(42,20,6,.14);border:2px solid transparent;transition:background .2s,border-color .2s,transform .25s cubic-bezier(.34,1.56,.64,1)}
.bar.past{background:var(--mostaza);border-color:var(--tinta)}
.bar.on{background:var(--tomate);border-color:var(--tinta);transform:translateY(-4px)}
.marker{position:absolute;bottom:-11px;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:9px solid var(--tinta);translate:-50% 0;transition:opacity .2s;opacity:0}
.exploring .marker{opacity:1}
.scale-labels{display:flex;justify-content:space-between;font:500 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-suave);padding-top:6px}

/* ---------- tarjeta ---------- */
.card{position:relative;z-index:2;background:var(--tinta);color:var(--mayo);border-radius:20px;padding:14px 18px 16px;display:grid;gap:4px}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:10px;height:28px;font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:rgba(255,247,223,.7)}
.status{transition:color .2s}
.chosen .status{font:400 20px/1 var(--display);letter-spacing:0;text-transform:none;color:var(--mostaza)}
.kcal{font-variant-numeric:tabular-nums;white-space:nowrap}
.name{font:400 clamp(22px,6.6vw,34px)/1.1 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{font-size:15px;line-height:1.35;color:rgba(255,247,223,.82);min-height:2.7em}
.action{height:46px;display:flex;align-items:center;gap:12px}
.action-hint{font:400 12.5px/1.35 var(--mono);color:rgba(255,247,223,.6)}
.again{border:2.5px solid var(--mayo);background:var(--mostaza);color:var(--tinta);font:800 15px/1 var(--body);padding:12px 18px;border-radius:999px;cursor:pointer;box-shadow:0 3px 0 var(--mayo);flex:none}
.again:active{transform:translateY(2px);box-shadow:0 1px 0 var(--mayo)}

@media (max-height:640px){
  h1{font-size:28px}
  .note{min-height:1.4em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bars{height:36px}
}
@media (prefers-reduced-motion:reduce){
  .f1,.f2,.steam path,.chosen .rays{animation:none}
  .steam path{opacity:.6}
  .sizer{transition:none}
}
</style>
</head>
<body>

<main class="app" id="app">
  <header>
    <div>
      <span class="eyebrow">Hambrómetro</span>
      <h1>¿Cuánta hambre <em>tienes?</em></h1>
    </div>
    <button class="reset" id="reset" type="button" aria-label="Reiniciar el demo">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8a5.5 5.5 0 1 0 1.8-4.1"/><path d="M2.5 2.2v3.4h3.4"/></svg>
      Reiniciar
    </button>
  </header>

  <section class="stage" id="stage" aria-label="Plato. Separa dos dedos para servir más comida, júntalos para servir menos.">
    <div class="rays" id="rays"></div>
    <div class="mat"></div>
    <div class="shake" id="shake">
      <div class="sizer" id="sizer">
        <div class="tension" id="tension">
          <div class="plate"></div>
          <div id="dishes"></div>
        </div>
      </div>
    </div>
    <svg class="steam" id="steam" viewBox="0 0 120 90" aria-hidden="true">
      <path d="M30 80 q-10 -14 0 -28 q10 -14 0 -28"/>
      <path d="M60 80 q-10 -14 0 -28 q10 -14 0 -28"/>
      <path d="M90 80 q-10 -14 0 -28 q10 -14 0 -28"/>
    </svg>
    <div class="stamp" id="stamp" aria-hidden="true">¡Este es tu plato!</div>
    <div class="hint" id="hint" aria-hidden="true">
      <div class="finger f1"></div>
      <div class="finger f2"></div>
    </div>
  </section>

  <section class="meter" aria-hidden="true">
    <div class="bars" id="bars"><div class="marker" id="marker"></div></div>
    <div class="scale-labels"><span>Un antojito</span><span>Hambre histórica</span></div>
  </section>

  <section class="card" aria-live="polite">
    <div class="card-top"><span class="status" id="status">Nivel 1 de 7</span><span class="kcal" id="kcal">≈ 220 kcal</span></div>
    <div class="name" id="name">Una empanada</div>
    <div class="note" id="note">Un antojito · con ají de la casa</div>
    <div class="action">
      <span class="action-hint" id="actionHint">Separa dos dedos sobre el plato para servirte más. Júntalos para servir menos.</span>
      <button class="again" id="again" type="button" hidden>Otra vez</button>
    </div>
  </section>
</main>

<script>
(() => {
const INK = '#2A1406';
const st = (w = 2.4) => `stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const shadow = (y, rx) => `<ellipse cx="0" cy="${y}" rx="${rx}" ry="${rx * .14}" fill="${INK}" opacity=".12"/>`;
const zig = (x0, y0, x1, y1, amp, n) => {
  const pts = [], dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy), nx = -dy / L, ny = dx / L;
  for (let i = 0; i <= n; i++) { const t = i / n, s = (i % 2 ? 1 : -1) * amp; pts.push(`${(x0 + dx * t + nx * s).toFixed(1)},${(y0 + dy * t + ny * s).toFixed(1)}`); }
  return pts.join(' ');
};
const sauce = (pts, color, w = 5) =>
  `<polyline points="${pts}" fill="none" stroke="${INK}" stroke-width="${w + 2.6}" stroke-linejoin="round" stroke-linecap="round"/>` +
  `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;

/* ---- 1. empanada ---- */
function empanada() {
  const r = rng(3); let s = shadow(40, 76);
  s += `<g transform="translate(-8,-6) rotate(-8)">`;
  const P = [[-66, 24], [-62, -58], [62, -58], [66, 24]];
  const bez = t => { const u = 1 - t; return [0, 1].map(k => u*u*u*P[0][k] + 3*u*u*t*P[1][k] + 3*u*t*t*P[2][k] + t*t*t*P[3][k]); };
  for (let i = 0; i <= 16; i++) { const [x, y] = bez(i / 16); s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="8" fill="#D88A2C" ${st(2)}/>`; }
  s += `<path d="M-66,24 C-62,-58 62,-58 66,24 Q0,30 -66,24 Z" fill="#EBA743" ${st()}/>`;
  for (let i = 0; i < 9; i++) { const x = -40 + r() * 80, y = -24 + r() * 38; s += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${(3 + r() * 4).toFixed(1)}" ry="${(2 + r() * 2).toFixed(1)}" fill="${r() > .5 ? '#F7CF7A' : '#C9772A'}" opacity=".8"/>`; }
  s += `<path d="M-40,-18 Q-20,-34 6,-36" fill="none" stroke="#F9DA92" stroke-width="4" stroke-linecap="round"/></g>`;
  s += `<g transform="translate(58,44)"><circle r="21" fill="#FFFDF5" ${st()}/><circle r="15" fill="#5E9E36"/>`;
  for (let i = 0; i < 12; i++) { const a = r() * 6.28, d = r() * 11; s += `<circle cx="${(Math.cos(a) * d).toFixed(1)}" cy="${(Math.sin(a) * d).toFixed(1)}" r="1.8" fill="${r() > .5 ? '#FFFFFF' : '#E4432F'}"/>`; }
  s += `</g><g transform="translate(-58,50) rotate(18)"><path d="M-19,0 A19,19 0 0 1 19,0 Z" fill="#8CC043" ${st()}/><path d="M-13,-1 A13,13 0 0 1 13,-1 Z" fill="#DDF0A0"/><path d="M0,-1 L0,-12 M0,-1 L-9,-8 M0,-1 L9,-8" stroke="#8CC043" stroke-width="1.6"/></g>`;
  return s;
}
/* ---- 2. arepa con quesito ---- */
function arepa() {
  const r = rng(11); let s = shadow(62, 70);
  s += `<circle r="66" fill="#F2CF86" ${st()}/><circle r="57" fill="none" stroke="#E2B060" stroke-width="3"/>`;
  for (let i = 0; i < 16; i++) { const a = r() * 6.28, d = 8 + r() * 46; s += `<ellipse cx="${(Math.cos(a) * d).toFixed(1)}" cy="${(Math.sin(a) * d).toFixed(1)}" rx="${(3 + r() * 5).toFixed(1)}" ry="${(2 + r() * 2.5).toFixed(1)}" transform="rotate(${(r() * 180).toFixed(0)} ${(Math.cos(a) * d).toFixed(1)} ${(Math.sin(a) * d).toFixed(1)})" fill="#C98B3A" opacity=".55"/>`; }
  s += `<path d="M-36,-30 L30,-36 Q41,-37 39,-25 L37,20 Q36,30 28,33 L24,48 Q19,56 14,47 L12,35 L-18,37 L-22,52 Q-27,58 -32,49 L-34,35 Q-43,31 -41,20 Z" fill="#FFE07A" ${st()}/>`;
  s += `<ellipse cx="-16" cy="-14" rx="5" ry="3.5" fill="#F2C94C"/><ellipse cx="18" cy="10" rx="4" ry="3" fill="#F2C94C"/><ellipse cx="-4" cy="20" rx="3" ry="2.4" fill="#F2C94C"/>`;
  s += `<g transform="rotate(12 6 -6)"><rect x="-6" y="-14" width="24" height="17" rx="4" fill="#FFF3B0" ${st(2)}/><path d="M-2,-10 L10,-10" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/></g>`;
  for (let i = 0; i < 10; i++) s += `<circle cx="${(-30 + r() * 60).toFixed(1)}" cy="${(-30 + r() * 60).toFixed(1)}" r="1.2" fill="#FFFFFF"/>`;
  return s;
}
/* ---- 3. porción de pizza ---- */
function pizza() {
  let s = shadow(74, 60);
  s += `<g transform="rotate(-7)">`;
  s += `<path d="M-64,-42 Q0,-64 64,-42 L5,80 Q0,86 -5,80 Z" fill="#D7261E" ${st()}/>`;
  s += `<path d="M-58,-38 Q0,-58 58,-38 L2,70 Z" fill="#FFD24A"/>`;
  s += `<path d="M20,36 Q26,50 19,56 Q12,50 13,38 Z" fill="#FFD24A" ${st(2)}/>`;
  [[-26,-28],[22,-30],[-4,0],[20,-2],[2,34],[-22,-2]].forEach(([x, y], i) => {
    if (i === 5) return;
    s += `<g transform="translate(${x},${y})"><circle r="11" fill="#B83224" ${st(2)}/><circle cx="-3" cy="-3" r="1.8" fill="#7E1D14"/><circle cx="4" cy="2" r="1.6" fill="#7E1D14"/><circle cx="-1" cy="5" r="1.4" fill="#7E1D14"/></g>`;
  });
  s += `<ellipse cx="-12" cy="16" rx="7" ry="3.5" transform="rotate(-30 -12 16)" fill="#3F8F3A" ${st(1.6)}/><ellipse cx="4" cy="-22" rx="7" ry="3.5" transform="rotate(20 4 -22)" fill="#3F8F3A" ${st(1.6)}/>`;
  s += `<path d="M-70,-46 Q0,-74 70,-46 Q73,-31 62,-29 Q0,-54 -62,-29 Q-73,-31 -70,-46 Z" fill="#E39B3E" ${st()}/>`;
  s += `<path d="M-46,-50 Q0,-64 40,-54" fill="none" stroke="#F6C77A" stroke-width="3.5" stroke-linecap="round"/></g>`;
  return s;
}
/* ---- 4. perro caliente ---- */
function perro() {
  const r = rng(21); let s = shadow(50, 82);
  s += `<g transform="rotate(-16)">`;
  s += `<rect x="-80" y="-36" width="160" height="24" rx="12" fill="#E6AC62" ${st()}/>`;
  s += `<rect x="-82" y="-24" width="164" height="54" rx="27" fill="#E0A155" ${st()}/>`;
  s += `<rect x="-72" y="-16" width="144" height="26" rx="13" fill="#F4D39A"/>`;
  s += `<rect x="-94" y="-15" width="188" height="27" rx="13.5" fill="#B8432F" ${st()}/>`;
  s += `<path d="M-74,-8 L64,-8" stroke="#E07A5F" stroke-width="3" stroke-linecap="round"/>`;
  s += sauce(zig(-72, -4, 72, -4, 7, 14), '#F2A1A1', 4.5);
  s += sauce(zig(-66, 4, 66, 4, 6, 12), '#F2B705', 4);
  for (let i = 0; i < 46; i++) {
    const x = -70 + r() * 140, y = -20 + r() * 30, w = 3 + r() * 4, h = 2 + r() * 3;
    s += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="1" transform="rotate(${(r() * 90).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})" fill="#F6CF5A" stroke="${INK}" stroke-width="1"/>`;
  }
  s += `</g>`;
  return s;
}
/* ---- 5. hamburguesa doble ---- */
function hamburguesa() {
  const r = rng(5); let s = '';
  for (let i = 0; i < 5; i++) s += `<rect x="-4.5" y="-24" width="9" height="48" rx="2" transform="translate(${60 + i * 7},${34 - i * 3}) rotate(${14 + i * 7})" fill="#F7C948" ${st(1.8)}/>`;
  s += shadow(64, 80);
  s += `<path d="M-64,42 L64,42 Q67,60 50,62 L-50,62 Q-67,60 -64,42 Z" fill="#E0A155" ${st()}/>`;
  const patty = y => { let p = `<rect x="-70" y="${y}" width="140" height="19" rx="9.5" fill="#6B3A22" ${st()}/>`; for (let i = 0; i < 12; i++) p += `<circle cx="${(-58 + r() * 116).toFixed(1)}" cy="${(y + 5 + r() * 9).toFixed(1)}" r="1.6" fill="#4A2616"/>`; return p; };
  const cheese = y => `<path d="M-68,${y} L68,${y} L68,${y + 6} L52,${y + 6} L45,${y + 18} L38,${y + 6} L-18,${y + 6} L-25,${y + 20} L-32,${y + 6} L-68,${y + 6} Z" fill="#FFC93C" ${st(2)}/>`;
  s += patty(26) + cheese(22) + patty(6) + cheese(2);
  s += `<rect x="-62" y="-7" width="124" height="10" rx="5" fill="#E4432F" ${st(2)}/>`;
  let top = 'M-72,-8';
  for (let i = 0; i <= 12; i++) { const x = -72 + i * 12; top += ` Q${x + 6},${-18} ${x + 12},-10`; }
  s += `<path d="${top} L72,-2 Q0,4 -72,-2 Z" fill="#7CC04B" ${st(2)}/>`;
  s += `<path d="M-66,-10 C-66,-68 66,-68 66,-10 Z" fill="#E6A04E" ${st()}/>`;
  s += `<path d="M-44,-38 Q-20,-54 10,-54" fill="none" stroke="#F4C685" stroke-width="4" stroke-linecap="round"/>`;
  [[-30,-30],[-8,-42],[16,-34],[36,-26],[-44,-20],[4,-22],[26,-46]].forEach(([x, y]) => { s += `<ellipse cx="${x}" cy="${y}" rx="3.4" ry="2" transform="rotate(${x % 40} ${x} ${y})" fill="#FFF4D6" stroke="${INK}" stroke-width="1"/>`; });
  return s;
}
/* ---- 6. bandeja paisa ---- */
function bandeja() {
  const r = rng(9); let s = '';
  // arroz + huevo
  s += `<ellipse cx="-38" cy="-36" rx="42" ry="33" fill="#FFFDF2" ${st()}/>`;
  for (let i = 0; i < 26; i++) { const x = -38 + (r() - .5) * 70, y = -36 + (r() - .5) * 50; s += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="3" ry="1.3" transform="rotate(${(r() * 180).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})" fill="#E6DCC0"/>`; }
  let egg = ''; for (let i = 0; i < 14; i++) { const a = i / 14 * 6.283, rad = 22 + Math.sin(i * 2.3) * 4; egg += `${i ? 'L' : 'M'}${(-30 + Math.cos(a) * rad).toFixed(1)},${(-42 + Math.sin(a) * rad * .85).toFixed(1)} `; }
  s += `<path d="${egg}Z" fill="#FFFFFF" ${st(2.2)}/><circle cx="-27" cy="-44" r="10" fill="#F9B233" ${st(2)}/><circle cx="-30" cy="-47" r="3" fill="#FCD577"/>`;
  // frijoles
  s += `<circle cx="40" cy="-40" r="34" fill="#FFFDF5" ${st()}/><circle cx="40" cy="-40" r="27" fill="#7A3522"/>`;
  for (let i = 0; i < 16; i++) { const a = r() * 6.28, d = r() * 21, x = 40 + Math.cos(a) * d, y = -40 + Math.sin(a) * d; s += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="4" ry="2.6" transform="rotate(${(r() * 180).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})" fill="#A0502F" stroke="#5A2A1A" stroke-width="1"/>`; }
  s += `<circle cx="34" cy="-48" r="3" fill="#E4632F"/><circle cx="46" cy="-34" r="2.4" fill="#E4632F"/><circle cx="30" cy="-30" r="2" fill="#7CC04B"/>`;
  // carne molida
  for (let i = 0; i < 34; i++) { const a = r() * 6.28, d = Math.sqrt(r()), x = -2 + Math.cos(a) * d * 22, y = 8 + Math.sin(a) * d * 14; s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(2.6 + r() * 2).toFixed(1)}" fill="${r() > .5 ? '#7A4A2A' : '#5E3520'}" stroke="${INK}" stroke-width=".8"/>`; }
  // arepita
  s += `<circle cx="72" cy="4" r="16" fill="#F4E2B0" ${st(2.2)}/><circle cx="68" cy="0" r="2.4" fill="#D9B46A"/><circle cx="76" cy="8" r="2" fill="#D9B46A"/>`;
  // aguacate
  s += `<g transform="translate(-68,22) rotate(-24)"><path d="M0,-26 Q22,-10 13,20 Q4,30 -7,21 Q-2,0 0,-26 Z" fill="#B7D66A" ${st()}/><path d="M0,-26 Q22,-10 13,20" fill="none" stroke="#2F5A1C" stroke-width="4.5" stroke-linecap="round"/></g>`;
  // chicharrón
  s += `<g transform="translate(46,30) rotate(-14)"><rect x="-32" y="-14" width="64" height="30" rx="7" fill="#D38A3A" ${st()}/><path d="M-32,-6 Q-24,-18 -16,-8 Q-8,-18 0,-8 Q8,-18 16,-8 Q24,-18 32,-6 L32,-8 Q32,-14 25,-14 L-25,-14 Q-32,-14 -32,-8 Z" fill="#8B4A1C" ${st(2)}/><path d="M-18,0 L-18,12 M0,0 L0,12 M18,0 L18,12" stroke="#A8622A" stroke-width="2.5" stroke-linecap="round"/></g>`;
  // chorizos
  [[-26, 56, 8], [4, 64, -6]].forEach(([x, y, a]) => { s += `<g transform="translate(${x},${y}) rotate(${a})"><circle cx="-22" cy="0" r="3" fill="#A63A24" ${st(1.6)}/><circle cx="22" cy="0" r="3" fill="#A63A24" ${st(1.6)}/><ellipse rx="20" ry="11" fill="#A63A24" ${st()}/><path d="M-10,-5 Q0,-8 10,-5" stroke="#D77055" stroke-width="2.5" fill="none" stroke-linecap="round"/></g>`; });
  // tajada de maduro
  s += `<g transform="translate(48,64) rotate(-28)"><ellipse rx="24" ry="9" fill="#E8962E" ${st()}/><path d="M-12,0 L12,0" stroke="#B5621C" stroke-width="3" stroke-linecap="round"/></g>`;
  return s;
}
/* ---- 7. salchipapa gigante ---- */
function salchipapa() {
  const r = rng(7); let s = shadow(96, 104);
  const fries = ['#F7C948', '#F2B93B', '#FAD766', '#EFB02E'];
  for (let i = 0; i < 170; i++) {
    const a = r() * 6.283, d = Math.pow(r(), .6), x = Math.cos(a) * d * 102, y = Math.sin(a) * d * 90, l = 32 + r() * 26;
    s += `<rect x="-4.5" y="${(-l / 2).toFixed(1)}" width="9" height="${l.toFixed(1)}" rx="2" transform="translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${(r() * 180).toFixed(0)})" fill="${fries[i % 4]}" ${st(1.6)}/>`;
  }
  for (let i = 0; i < 30; i++) {
    const a = r() * 6.283, d = Math.sqrt(r()) * 78, x = Math.cos(a) * d, y = Math.sin(a) * d * .9;
    s += `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${(r() * 180).toFixed(0)})"><ellipse rx="11" ry="10" fill="#C45A3C" ${st(1.8)}/><ellipse rx="7" ry="6" fill="#DE8466"/><path d="M-4,-1 L4,1" stroke="#8E3322" stroke-width="1.6" stroke-linecap="round"/></g>`;
  }
  for (let i = 0; i < 8; i++) {
    const a = r() * 6.283, d = Math.sqrt(r()) * 70, x = Math.cos(a) * d, y = Math.sin(a) * d * .9;
    s += `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${(r() * 180).toFixed(0)})"><ellipse rx="10" ry="7.5" fill="#FFFFFF" ${st(1.6)}/><circle r="4.2" fill="#F6B42A"/></g>`;
  }
  s += sauce(zig(-96, -40, 90, 10, 9, 22), '#D7261E', 5);
  s += sauce(zig(-86, 20, 96, -30, 8, 22), '#FFF6D6', 5);
  s += sauce(zig(-70, -70, 60, 72, 8, 20), '#F2B705', 4.5);
  s += sauce(zig(70, -70, -60, 70, 8, 20), '#F29C9C', 4.5);
  for (let i = 0; i < 40; i++) { const x = (r() - .5) * 150, y = (r() - .5) * 130; s += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="10" height="2.6" rx="1.3" transform="rotate(${(r() * 180).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})" fill="#FFE27A" stroke="${INK}" stroke-width=".8"/>`; }
  return s;
}

const DISHES = [
  { name: 'Una empanada',       mood: 'Un antojito',       kcal: 220,  note: 'con ají de la casa',                 size: .62, draw: empanada },
  { name: 'Arepa con quesito',  mood: 'Algo liviano',      kcal: 330,  note: 'con mantequilla y sal',              size: .68, draw: arepa },
  { name: 'Porción de pizza',   mood: 'Con ganas',         kcal: 390,  note: 'la porción más grande de la caja',   size: .73, draw: pizza },
  { name: 'Perro caliente',     mood: 'Hambre en serio',   kcal: 560,  note: 'con papita triturada y salsa rosada',size: .79, draw: perro },
  { name: 'Hamburguesa doble',  mood: 'Mucha hambre',      kcal: 900,  note: 'doble carne, doble queso',           size: .86, draw: hamburguesa },
  { name: 'Bandeja paisa',      mood: 'Hambre de arriero', kcal: 1450, note: 'frijoles, arroz, huevo, chicharrón y más', size: .95, draw: bandeja },
  { name: 'Salchipapa gigante', mood: 'Hambre histórica',  kcal: 2400, note: 'para compartir (o no)',              size: 1.0, draw: salchipapa },
];
const N = DISHES.length;
const K = 2.6;        // niveles por cada vez que se duplica la distancia entre dedos
const HYST = 0.24;    // margen extra antes de cambiar de plato
const DEAD = 14;      // px de movimiento antes de empezar a explorar

const $ = id => document.getElementById(id);
const app = $('app'), stage = $('stage'), shakeEl = $('shake'), sizer = $('sizer'), tensionEl = $('tension');
const rays = $('rays'), stamp = $('stamp'), hint = $('hint'), marker = $('marker');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

const layers = DISHES.map((d, i) => {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '-130 -130 260 260'); svg.setAttribute('class', 'dish');
  svg.innerHTML = d.draw(); $('dishes').appendChild(svg); return svg;
});
const bars = DISHES.map((d, i) => { const b = document.createElement('div'); b.className = 'bar'; b.style.height = (12 + i * 6) + 'px'; $('bars').insertBefore(b, marker); return b; });

if (matchMedia('(pointer: fine)').matches) $('actionHint').textContent = 'En computador: rueda del mouse o pellizco del trackpad sobre el plato. Flechas también sirven.';

let idx = 0, raw = 0, tension = 0, mode = 'idle';

function fit() {
  const r = stage.getBoundingClientRect();
  const base = Math.max(150, Math.min(r.width * .8, r.height * .84));
  document.documentElement.style.setProperty('--base', base + 'px');
}
new ResizeObserver(fit).observe(stage); fit();

function paint() {
  const d = DISHES[idx];
  sizer.style.transform = `scale(${d.size})`;
  bars.forEach((b, i) => { b.classList.toggle('on', i === idx); b.classList.toggle('past', i < idx); });
  $('name').textContent = d.name;
  $('note').textContent = `${d.mood} · ${d.note}`;
  $('kcal').textContent = `≈ ${d.kcal.toLocaleString('es-CO')} kcal`;
  if (mode !== 'chosen') $('status').textContent = `Nivel ${idx + 1} de ${N}`;
}

function swap(to, dir) {
  const from = layers[idx], next = layers[to];
  [from, next].forEach(el => el.getAnimations().forEach(a => a.cancel()));
  from.style.opacity = 0; next.style.opacity = 1;
  if (reduce) return;
  const up = dir > 0;
  from.animate(up
    ? [{ opacity: 1, transform: 'scale(1) rotate(0)' }, { opacity: 0, transform: 'scale(.45) rotate(-35deg)' }]
    : [{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(1.35) rotate(18deg)' }],
    { duration: 260, easing: 'cubic-bezier(.5,0,.75,0)' });
  next.animate(up
    ? [{ opacity: 0, transform: 'scale(.35) rotate(28deg)' }, { opacity: 1, transform: 'scale(1.16) rotate(-5deg)', offset: .62 }, { opacity: 1, transform: 'scale(1) rotate(0)' }]
    : [{ opacity: 0, transform: 'scale(1.5) rotate(-14deg)' }, { opacity: 1, transform: 'scale(.9) rotate(3deg)', offset: .6 }, { opacity: 1, transform: 'scale(1) rotate(0)' }],
    { duration: 440, easing: 'cubic-bezier(.2,.8,.3,1)' });
}

function setIdx(n, dir) {
  if (n === idx) return;
  swap(n, dir); idx = n; paint();
  bars[idx].animate([{ transform: 'translateY(-4px) scaleY(1.3)' }, { transform: 'translateY(-4px)' }], { duration: 260, easing: 'ease-out' });
  try { navigator.vibrate && navigator.vibrate(8); } catch (e) {}
}

function updateRaw(v) {
  raw = Math.min(N - 1 + .7, Math.max(-.7, v));
  while (raw > idx + .5 + HYST && idx < N - 1) setIdx(idx + 1, 1);
  while (raw < idx - .5 - HYST && idx > 0) setIdx(idx - 1, -1);
  tension = raw - idx;
  tensionEl.style.transform = `scale(${1 + tension * .15}) rotate(${tension * 6}deg)`;
  marker.style.left = `calc(${(Math.min(N - 1, Math.max(0, raw)) + .5) / N * 100}%)`;
  if (idx === N - 1 && tension > .45) $('actionHint').textContent = 'Más grande no la sirven en ningún lado.';
  else if (idx === 0 && tension < -.45) $('actionHint').textContent = 'Menos que una empanada ya es no tener hambre.';
  else $('actionHint').textContent = 'Separa para más. Junta para menos. Suelta cuando se te antoje.';
}

function explore() {
  if (mode === 'explore') return;
  mode = 'explore'; raw = idx;
  app.classList.add('exploring'); app.classList.remove('chosen');
  hint.dataset.off = '';
  stamp.getAnimations().forEach(a => a.cancel()); stamp.style.opacity = 0;
  rays.getAnimations().forEach(a => a.cancel()); rays.style.opacity = 0;
  $('again').hidden = true; $('actionHint').hidden = false;
  paint();
}

function choose() {
  if (mode !== 'explore') return;
  mode = 'chosen';
  app.classList.remove('exploring'); app.classList.add('chosen');
  $('status').textContent = '¡Este es tu plato!';
  $('actionHint').hidden = true; $('again').hidden = false;
  const t = tensionEl.style.transform || 'none';
  tensionEl.style.transform = '';
  tension = 0;
  try { navigator.vibrate && navigator.vibrate([12, 60, 24]); } catch (e) {}
  const size = DISHES[idx].size, base = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--base'));
  stamp.style.transform = '';
  const cx = stage.clientWidth / 2, cy = stage.clientHeight / 2, R = base * size / 2;
  stamp.style.left = Math.min(stage.clientWidth - 122, cx + R * .45) + 'px';
  stamp.style.top = Math.max(0, cy - R - 34) + 'px';
  const steam = $('steam');
  steam.style.left = (cx - 60) + 'px';
  steam.style.top = Math.max(-20, cy - R - 70) + 'px';
  stamp.style.opacity = 1; rays.style.opacity = 1;
  if (reduce) { rays.style.transform = 'scale(1)'; stamp.style.rotate = '-12deg'; return; }
  tensionEl.animate([
    { transform: t }, { transform: 'scale(.9) rotate(0)', offset: .25 }, { transform: 'scale(1.1) rotate(-2deg)', offset: .55 }, { transform: 'scale(.98)', offset: .8 }, { transform: 'none' }
  ], { duration: 620, easing: 'ease-out' });
  rays.style.transform = 'scale(1)';
  rays.animate([{ opacity: 0, transform: 'scale(.3)' }, { opacity: 1, transform: 'scale(1.08)', offset: .7 }, { opacity: 1, transform: 'scale(1)' }], { duration: 700, easing: 'cubic-bezier(.2,.8,.3,1)' });
  stamp.style.rotate = '-12deg';
  stamp.animate([{ opacity: 0, transform: 'scale(2.6) rotate(-30deg)' }, { opacity: 1, transform: 'scale(.9) rotate(4deg)', offset: .7 }, { opacity: 1, transform: 'scale(1)' }], { duration: 420, delay: 200, easing: 'cubic-bezier(.3,0,.2,1)', fill: 'backwards' });
}

function nudge() {
  if (reduce) return;
  tensionEl.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(-4deg)' }, { transform: 'rotate(4deg)' }, { transform: 'rotate(0)' }], { duration: 320 });
  $('actionHint').textContent = 'Con dos dedos: sepáralos para servirte más.';
}

function reset() {
  const was = idx;
  mode = 'idle'; tension = 0; raw = 0;
  app.classList.remove('exploring', 'chosen');
  [stamp, rays].forEach(el => { el.getAnimations().forEach(a => a.cancel()); el.style.opacity = 0; });
  tensionEl.style.transform = '';
  if (was !== 0) { swap(0, -1); idx = 0; } else layers[0].style.opacity = 1;
  delete hint.dataset.off;
  $('again').hidden = true; $('actionHint').hidden = false;
  $('actionHint').textContent = matchMedia('(pointer: fine)').matches
    ? 'En computador: rueda del mouse o pellizco del trackpad sobre el plato. Flechas también sirven.'
    : 'Separa dos dedos sobre el plato para servirte más. Júntalos para servir menos.';
  paint();
}

/* ---- temblor mientras se explora ---- */
let sx = 0, sy = 0, sr = 0;
(function loop() {
  if (mode === 'explore' && !reduce) {
    const amp = .7 + Math.abs(tension) * 5 + idx * .45;
    sx += ((Math.random() - .5) * 2 * amp - sx) * .55;
    sy += ((Math.random() - .5) * 2 * amp - sy) * .55;
    sr += ((Math.random() - .5) * amp * .5 - sr) * .5;
  } else { sx *= .75; sy *= .75; sr *= .75; }
  shakeEl.style.transform = `translate(${sx.toFixed(2)}px,${sy.toFixed(2)}px) rotate(${sr.toFixed(2)}deg)`;
  requestAnimationFrame(loop);
})();

/* ---- gesto: dos dedos ---- */
const pts = new Map();
let pinching = false, engaged = false, d0 = 0, raw0 = 0, moved1 = false;
const dist = () => { const [a, b] = [...pts.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };

stage.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 1) moved1 = false;
  if (pts.size === 2) { pinching = true; engaged = false; d0 = dist(); }
});
stage.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  const p = pts.get(e.pointerId);
  if (Math.hypot(e.clientX - p.x, e.clientY - p.y) > 6) moved1 = true;
  p.x = e.clientX; p.y = e.clientY;
  if (!pinching || pts.size < 2) return;
  const d = dist();
  if (!engaged) {
    if (Math.abs(d - d0) < DEAD) return;
    engaged = true; d0 = d; explore(); raw0 = idx;
  }
  updateRaw(raw0 + Math.log2(Math.max(1, d) / Math.max(1, d0)) * K);
});
const lift = e => {
  if (!pts.has(e.pointerId)) return;
  const wasSingle = pts.size === 1 && !pinching;
  pts.delete(e.pointerId);
  if (pinching && pts.size < 2) { pinching = false; if (engaged) choose(); }
  if (wasSingle && e.pointerType === 'touch' && mode !== 'explore') nudge();
};
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => stage.addEventListener(t, lift));
stage.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

/* ---- computador: rueda, trackpad y flechas ---- */
let settleT;
const settleSoon = ms => { clearTimeout(settleT); settleT = setTimeout(choose, ms); };
stage.addEventListener('wheel', e => {
  e.preventDefault();
  explore();
  updateRaw(raw - e.deltaY * (e.ctrlKey ? .03 : .006));
  settleSoon(450);
}, { passive: false });
addEventListener('keydown', e => {
  if (e.key === 'ArrowUp' || e.key === 'ArrowRight' || e.key === '+') { explore(); updateRaw(idx + 1); settleSoon(700); e.preventDefault(); }
  else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === '-') { explore(); updateRaw(idx - 1); settleSoon(700); e.preventDefault(); }
  else if (e.key === 'r' || e.key === 'R') reset();
});

$('reset').addEventListener('click', reset);
$('again').addEventListener('click', reset);
reset();
})();
</script>
</body>
</html>
